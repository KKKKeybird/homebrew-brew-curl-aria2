name: Test shim

on:
  push:
  pull_request:

jobs:
  shim:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Test curl routing and fallback
        run: bash test/shim.bash
      - name: Test Homebrew compatibility lifecycle
        run: ruby test/compatibility.rb
      - name: Install aria2 (macOS)
        if: runner.os == 'macOS'
        run: brew install aria2
      - name: Install aria2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y aria2
      - name: Test actual aria2 resume and file integrity
        run: python3 test/resume.py
      - name: Verify bounded HTTP requests and response byte totals
        run: python3 test/bounded_ranges.py
      - name: Test TLS trust and stdin authentication
        run: python3 test/tls_and_headers.py
      - name: Test contiguous progress safety
        run: ruby test/contiguous_progress.rb
      - name: Test real Homebrew updates, install, upgrade and native progress (macOS)
        if: runner.os == 'macOS'
        run: python3 test/homebrew_integration.py
      - name: Test release packaging
        run: python3 test/release.py
