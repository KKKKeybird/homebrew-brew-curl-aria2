name: Test shim

on:
  push:
  pull_request:

jobs:
  shim:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Test curl routing and fallback
        run: bash test/shim.bash
      - name: Test release packaging
        run: python3 test/release.py
