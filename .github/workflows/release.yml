name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (major.minor.patch, without v)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Test shim
        run: bash test/shim.bash
      - name: Prepare release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/prepare_release.py "$RELEASE_VERSION" "$RUNNER_TEMP"
      - name: Publish tag, Formula, and release asset
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          archive="$RUNNER_TEMP/brew-curl-aria2-${RELEASE_VERSION}.tar.gz"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if ! git diff --quiet; then
              echo "Existing tag does not match the requested release contents" >&2
              exit 1
            fi
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git merge-base --is-ancestor "$tag^{commit}" HEAD
          else
            git add Formula/brew-curl-aria2.rb bin/brew-curl-aria2
            git commit -m "Release $tag"
            git tag -a "$tag" -m "Release $tag"
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            expected_digest="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
            published_digest="$(gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"$(basename "$archive")\") | .digest")"
            test "$published_digest" = "$expected_digest"
            echo "Release $tag already exists with matching archive"
          else
            gh release create "$tag" "$archive" --verify-tag --generate-notes --title "$tag"
          fi
